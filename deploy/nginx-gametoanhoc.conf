# Copy to /etc/nginx/conf.d/gametoanhoc.conf on EC2
# Thay YOUR_DOMAIN bằng domain hoặc IP public của EC2.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10M;

    # Frontend SPA (Vite build, base /gametoanhoc/)
    location /gametoanhoc/ {
        alias /var/www/gametoanhoc/;
        try_files $uri $uri/ /gametoanhoc/index.html;
    }

    location = / {
        return 302 /gametoanhoc/;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh & nhạc tĩnh từ Express
    location ~ ^/(questions-images|items-images|types-images|lessons-images|grades-images|music)/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
